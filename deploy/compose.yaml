name: txl-reign
services:
  app:
    image: ${REIGN_IMAGE:-txl/reign-services:oracle-launch}
    build: ..
    restart: unless-stopped
    env_file: /etc/txl/apps/reign-services.env
    ports: ["127.0.0.1:5000:5000"]
    networks: [data, egress]
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  migrate:
    image: ${REIGN_IMAGE:-txl/reign-services:oracle-launch}
    profiles: [tools]
    env_file: /etc/txl/apps/reign-services-migrate.env
    command: [node, script/migrate.cjs]
    networks: [data]
    mem_limit: 256m
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  data:
    external: true
    name: txl-core_data
  egress:
