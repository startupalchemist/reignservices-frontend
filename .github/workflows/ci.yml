name: Reign CI
on:
  push:
    branches: [main, dev, staging, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test
          POSTGRES_DB: reign_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reign_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-test@127.0.0.1:5432/reign_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: node script/migrate.cjs
      - run: npm run test:integration
      - run: npm run build
      - run: docker build -t reign-ci:${{ github.sha }} .
